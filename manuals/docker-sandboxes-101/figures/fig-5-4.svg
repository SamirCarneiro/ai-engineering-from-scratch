<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-5-4-title fig-5-4-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 456"><title id="fig-5-4-title">A delegation that returns, then a move that stays</title><desc id="fig-5-4-desc">Four lifelines: you running docker-agent run with exec, root, writer, and reviewer from capture/fixtures/agents/team.yaml. Message 1 asks root for one sentence from the writer. Root calls transfer_task with agent writer, a task and an expected output, the writer runs in its own sub-session that holds only the task, and its sentence, MicroVMs are lightweight virtual machines, returns to root as the tool response. Root then calls the session-moving tool with agent reviewer, and reviewer answers APPROVED with the sentence. Message 2 goes straight to reviewer, which answers the same way, and root is not asked again.</desc><defs><marker id="fig-5-4-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-5-4-head-amber" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-amber-ink, #85590c)" d="M0 1 L10 5 L0 9 z"/></marker></defs><rect width="100" height="30" x="36" y="10" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/><text x="86" y="28.45" font-size="11.5" font-weight="700" text-anchor="middle">you, --exec</text><line x1="86" x2="86" y1="40" y2="444" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="100" height="30" x="196" y="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="246" y="28.45" font-size="11.5" font-weight="700" text-anchor="middle">root</text><line x1="246" x2="246" y1="40" y2="444" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="100" height="30" x="356" y="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="406" y="28.45" font-size="11.5" font-weight="700" text-anchor="middle">writer</text><line x1="406" x2="406" y1="40" y2="444" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="100" height="30" x="516" y="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="566" y="28.45" font-size="11.5" font-weight="700" text-anchor="middle">reviewer</text><line x1="566" x2="566" y1="40" y2="444" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><circle cx="18" cy="76" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="18" y="80" font-size="11" text-anchor="middle">1</text><line x1="86" x2="245" y1="76" y2="76" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-4-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="0.8s" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" path="M86 76 L245 76"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="0.8s" keyTimes="0;0;0.1;0.688;1" values="0;0;1;1;0"/></circle><rect width="219.9" height="15.5" x="55.55" y="59.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="165.5" y="70" font-size="11.5" text-anchor="middle">Ask the writer for one sentence</text><rect width="59.46" height="15" x="135.77" y="80.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="165.5" y="91" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">message 1</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><circle cx="18" cy="126" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="18" y="130" font-size="11" text-anchor="middle">2</text><line x1="246" x2="405" y1="126" y2="126" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-4-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M246 126 L405 126"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="95.7" height="15.5" x="277.65" y="109.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="325.5" y="120" font-size="11.5" text-anchor="middle">transfer_task</text><rect width="219.84" height="15" x="215.58" y="130.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="325.5" y="141" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">agent: writer, task, expected_output</text><rect width="110" height="46" x="351" y="150" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><text x="406" y="168.1" font-size="12" font-weight="700" text-anchor="middle">sub-session</text><text x="406" y="185.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">task only</text><