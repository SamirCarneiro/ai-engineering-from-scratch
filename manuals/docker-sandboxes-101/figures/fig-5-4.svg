" stroke-width="1"/><text x="18" y="280" fill="var(--m-amber-ink, #85590c)" font-size="11" text-anchor="middle">4</text><line x1="246" x2="565" y1="276" y2="276" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-4-head-amber)"/><circle r="3.5" fill="var(--m-amber-ink, #85590c)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="2.6s" keyPoints="0;0;1;1" keyTimes="0;0.692;0.904;1" path="M246 276 L565 276"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="2.6s" keyTimes="0;0.692;0.723;0.904;1" values="0;0;1;1;0"/></circle><rect width="150.9" height="15.5" x="330.05" y="259.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405.5" y="270" fill="var(--m-amber-ink, #85590c)" font-size="11.5" text-anchor="middle">{&quot;agent&quot;: &quot;reviewer&quot;}</text><rect width="178.26" height="15" x="316.37" y="280.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405.5" y="291" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">the session moves to reviewer</text></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><circle cx="18" cy="326" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="18" y="330" font-size="11" text-anchor="middle">5</text><line x1="566" x2="87" y1="326" y2="326" stroke="var(--m-ink, #1a1a1a)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-4-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="lin