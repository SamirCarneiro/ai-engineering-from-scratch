r(--m-panel, #f3f1e8)" class="m-knock"/><text x="325.5" y="391" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">message 2</text></g><g data-beat="7"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" type="translate" values="0 4;0 4;0 0"/><circle cx="18" cy="426" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="18" y="430" font-size="11" text-anchor="middle">7</text><line x1="566" x2="87" y1="426" y2="426" stroke="var(--m-ink, #1a1a1a)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-4-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="4.4s" keyPoints="0;0;1;1" keyTimes="0;0.818;0.943;1" path="M566 426 L87 426"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="4.4s" keyTimes="0;0.818;0.836;0.943;1" values="0;0;1;1;0"/></circle><rect width="240.6" height="15.5" x="206.2" y="409.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="326.5" y="420" font-size="11.5" text-anchor="middle">APPROVED: MicroVMs are lightweight</text><rect width="142.62" height="15" x="255.19" y="430.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="326.5" y="441" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">root is not asked again</text></g></svg>