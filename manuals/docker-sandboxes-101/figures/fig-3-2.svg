<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-3-2-title fig-3-2-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 356"><title id="fig-3-2-title">One commit from the clone to the host</title><desc id="fig-3-2-desc">On the left, the host repository at $CAPTURE/fixtures/repo-clone with main at c7dfd56. A read-only virtiofs mount carries it into the sandbox m101-clone at /run/sandbox/source. The agent works in a private clone on an ext4 volume whose origin is that mount, and commits 81e11df. A git push to origin is refused by the read-only mount. git-daemon serves the clone on port 9418, published on a loopback port, and the host remote sandbox-m101-clone fetches it into refs/remotes/sandbox-m101-clone/main and refs/sandboxes/m101-clone/main. After sbx rm, the remote is gone and the refs/sandboxes entry survives.</desc><defs><marker id="fig-3-2-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-3-2-head-rose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-rose-ink, #b0344d)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-3-2-head-teal" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-teal-ink, #18696a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-3-2-head-amber" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-amber-ink, #85590c)" d="M0 1 L10 5 L0 9 z"/></marker></defs><text x="20" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">HOST · $CAPTURE/FIXTURES/REPO-CLONE</text><text x="350" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">SANDBOX M101-CLONE</text><rect width="270" height="50" x="20" y="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="155" y="46.25" font-size="12.5" font-weight="700" text-anchor="middle">.git and working tree</text><text x="155" y="63.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">main at c7dfd56 second</text><rect width="270" height="50" x="350" y="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)" stroke-dasharray="5 4"/><text x="485" y="46.25" font-size="12.5" font-weight="700" text-anchor="middle">/run/sandbox/source</text><text x="485" y="63.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">virtiofs ro · Read-only file system</text><line x1="290" x2="349" y1="51" y2="51" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/><rect width="102.6" height="15.5" x="268.2" y="34.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="319.5" y="45" font-size="11.5" text-anchor="middle">bind mount, ro</text><rect width="270" height="70" x="350" y="110" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="485" y="132.75" font-size="12.5" font-weight="700" text-anchor="middle">private clone, same path</text><text x="485" y="150.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">/dev/vde ext4 rw · origin = the mount</text><text x="485" y="165.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">81e11df from sandbox</text><line x1="560" x2="560" y1="76" y2="109" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/><rect width="68.1" height="15.5" x="565" y="81.53" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="568" y="92.5" font-size="11.5">git clone</text><line x1="370" x2="370" y1="110" y2="77" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-3-2-head-rose)"/><rect width="171.6" height="15.5" x="375" y="82.53" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="378" y="93.5" fill="var(--m-rose-ink, #b0344d)" font-size="11.5">git push: unpacker error</text><rect width="270" height="50" x="350" y="214" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="485" y="234.25" font-size="12.5" font-weight="700" text-anchor="middle">git-daemon :9418</text><text x="485" y="251.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">published as 127.0.0.1:&lt;port&gt;-&gt;9418/tcp4</text><line x1="485" x2="485" y1="180" y2="213" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/><rect width="116.4" height="15.5" x="490" y="185.53" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="493" y="196.5" font-size="11.5">serves the clone</text><rect width="270" height="70" x="20" y="110" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/><text x="155" y="132.75" font-size="12.5" font-weight="700" text-anchor="middle">remote sandbox-m101-clone</text><text x="155" y="150.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">git://127.0.0.1:&lt;port&gt;/repo-clone</text><text x="155" y="165.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">two fetch refspecs in .git/config</text><path fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-linejoin="round" stroke-width="1.2" marker-end="url(#fig-3-2-head-teal)" d="M349 239 H320 V145 H291"/><rect width="190.8" height="15" x="297" y="189.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="300" y="200" fill="var(--m-teal-ink, #18696a)" font-size="11">git fetch sandbox-m101-clone</text><rect width="270" height="70" x="20" y="214" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/><text x="155" y="236.75" font-size="12.5" font-weight="700" text-anchor="middle">after the fetch</text><text x="155" y="254.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">sandbox-m101-clone/main 81e11df</text><text x="155" y="269.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">refs/sandboxes/m101-clone/main 81e11df</text><line x1="155" x2="155" y1="180" y2="213" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-teal)"/><rect width="600" height="36" x="20" y="308" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/><text x="320" y="329.45" font-size="11.5" font-weight="400" text-anchor="middle">sbx rm: remote and daemon removed, refs/sandboxes/m101-clone/main survives</text><line x1="155" x2="155" y1="284" y2="307" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-3-2-head-amber)"/></svg>