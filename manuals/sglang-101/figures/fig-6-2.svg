<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-6-2-title fig-6-2-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 236"><title id="fig-6-2-title">One token through an MoE layer</title><desc id="fig-6-2-desc">Four stages from left to right. TopK picks experts for each token. The dispatcher, chosen with moe-a2a-backend, moves tokens to the GPUs that hold those experts. MoeRunner computes the local experts with a grouped matrix multiply chosen with moe-runner-backend. The dispatcher combines the results and moves them back.</desc><defs><marker id="fig-6-2-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-6-2-head-indigo" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-indigo-ink, #4b4f9e)" d="M0 1 L10 5 L0 9 z"/></marker></defs><text x="20" y="22" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">ONE MOE LAYER, EVERY STEP</text><rect width="142" height="92" x="20" y="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="91" y="73.75" font-size="12.5" font-weight="700" text-anchor="middle">TopK</text><text x="91" y="91.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">picks experts</text><text x="91" y="106.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">for each token</text><rect width="142" height="92" x="176" y="40" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/><text x="247" y="73.75" font-size="12.5" font-weight="700" text-anchor="middle">dispatch</text><text x="247" y="91.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">tokens move to</text><text x="247" y="106.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">expert GPUs</text><rect width="142" height="92" x="332" y="40" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/><text x="403" y="73.75" font-size="12.5" font-weight="700" text-anchor="middle">MoeRunner</text><text x="403" y="91.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">grouped matrix</text><text x="403" y="106.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">multiply</text><rect width="142" height="92" x="488" y="40" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/><text x="559" y="73.75" font-size="12.5" font-weight="700" text-anchor="middle">combine</text><text x="559" y="91.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">results move</text><text x="559" y="106.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">back to tokens</text><line x1="162" x2="175" y1="86" y2="86" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/><line x1="318" x2="331" y1="86" y2="86" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-width="1.2" marker-end="url(#fig-6-2-head-indigo)"/><line x1="474" x2="487" y1="86" y2="86" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-width="1.2" marker-end="url(#fig-6-2-head-indigo)"/><text x="176" y="156" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11">--moe-a2a-backend</text><text x="332" y="156" fill="var(--m-plum-ink, #8a3d72)" font-size="11">--moe-runner-backend</text><text x="488" y="156" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11">--moe-a2a-backend</text><line x1="20" x2="630" y1="176" y2="176" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".4" stroke-width="1"/><text x="20" y="198" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">--deepep-mode auto: normal for prefill batches, low_latency for decode</text><text x="20" y="218" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">all-to-all backends set --ep-size to --tp-size</text></svg>