<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-3-1-title fig-3-1-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 250"><title id="fig-3-1-title">What one token costs in Qwen3-0.6B</title><desc id="fig-3-1-desc">Five factors from the Qwen3-0.6B config multiply to 114,688 bytes per token: 2 for key and value, 28 layers, 8 KV heads, a head dimension of 128, and 2 bytes for bfloat16. The startup log prints the same number as bytes_per_slot, and 181,574 slots of that size make a pool of 20.82 GB, which is 19.39 GiB.</desc><text x="20" y="20" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">ONE TOKEN, FIVE FACTORS</text><rect width="80" height="56" x="20" y="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="60" y="58.3" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="60" y="76.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">K and V</text><text x="107" y="68" fill="var(--m-ink-soft, #4a4a4a)" font-size="14" text-anchor="middle">×</text><rect width="80" height="56" x="114" y="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="154" y="58.3" font-size="16" font-weight="700" text-anchor="middle">28</text><text x="154" y="76.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">layers</text><text x="201" y="68" fill="var(--m-ink-soft, #4a4a4a)" font-size="14" text-anchor="middle">×</text><rect width="80" height="56" x="208" y="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="248" y="58.3" font-size="16" font-weight="700" text-anchor="middle">8</text><text x="248" y="76.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">KV heads</text><text x="295" y="68" fill="var(--m-ink-soft, #4a4a4a)" font-size="14" text-anchor="middle">×</text><rect width="80" height="56" x="302" y="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="342" y="58.3" font-size="16" font-weight="700" text-anchor="middle">128</text><text x="342" y="76.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">head dim</text><text x="389" y="68" fill="var(--m-ink-soft, #4a4a4a)" font-size="14" text-anchor="middle">×</text><rect width="80" height="56" x="396" y="34" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="436" y="58.3" font-size="16" font-weight="700" text-anchor="middle">2 B</text><text x="436" y="76.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">bfloat16</text><text x="484" y="68" fill="var(--m-ink-soft, #4a4a4a)" font-size="16" text-anchor="middle">=</text><rect width="120" height="56" x="500" y="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="560" y="57.4" font-size="13" font-weight="700" text-anchor="middle">114,688 B</text><text x="560" y="74.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">112 KiB</text><text x="20" y="124" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">THE SAME NUMBER IN THE STARTUP LOG</text><rect width="600" height="44" x="20" y="134" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="151.25" font-size="12.5" font-weight="700">Auto-sized attention KV pool</text><text x="32" y="168.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">kv_budget=19.39 GB · bytes_per_slot=114688 · pool_size=181574</text><text x="20" y="206" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">POOL SIZE</text><text x="20" y="228" class="m-serif" font-size="12">181,574 slots × 114,688 bytes = 20.82 GB, or 19.39 GiB, of KV</text></svg>