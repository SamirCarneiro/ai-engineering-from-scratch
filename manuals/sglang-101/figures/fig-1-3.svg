-linecap="round" stroke-width="1.2" marker-end="url(#fig-1-3-head-indigo)"/><circle r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.2s" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" path="M390 266 L559 266"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.2s" keyTimes="0;0.75;0.775;0.922;1" values="0;0;1;1;0"/></circle><rect width="81.9" height="15.5" x="434.05" y="249.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="475" y="260" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11.5" text-anchor="middle">first token</text><rect width="148.56" height="15" x="400.72" y="270.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="475" y="281" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">889 ms after the request</text></g><g data-beat="6"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" type="translate" values="0 4;0 4;0 0"/><circle cx="16" cy="314" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="16" y="318" font-size="11" text-anchor="middle">6</text><line x1="390" x2="559" y1="314" y2="314" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-width="1.2" marker-end="url(#fig-1-3-head-indigo)"/><circle r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.8s" keyPoints="0;0;1;1" keyTimes="0;0.789;0.934;1" path="M390 314 L559 314"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.8s" keyTimes="0;0.789;0.811;0.934;1" values="0;0;1;1;0"/></circle><rect width="102.6" height="15.5" x="423.7" y="297.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="475" y="308" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11.5" text-anchor="middle">11 more tokens</text><rect width="118.86" height="15" x="415.57" y="318.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="475" y="329" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">decode steps, 61 ms</text></g><g data-beat="7"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" type="translate" values="0 4;0 4;0 0"/><circle cx="16" cy="362" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="16" y="366" font-size="11" text-anchor="middle">7</text><line x1="560" x2="221" y1="362" y2="362" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-width="1.2" marker-end="url(#fig-1-3-head-indigo)"/><circle r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="4.4s" keyPoints="0;0;1;1" keyTimes="0;0.818;0.943;1" path="M560 362 L221 362"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="4.4s" keyTimes="0;0.818;0.836;0.943;1" values="0;0;1;1;0"/></circle><rect width="33.6" height="15.5" x="373.2" y="345.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="390" y="356" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11.5" text-anchor="middle">text</text><rect width="154.5" height="15" x="312.75" y="366.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="390" y="377" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">Paris, and the capital of</text></g><g data-beat="8"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="4.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.903;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="4.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.903;1" type="translate" values="0 4;0 4;0 0"/><circle cx="16" cy="410" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="16" y="414" font-size="11" text-anchor="middle">8</text><line x1="220" x2="71" y1="410" y2="410" stroke="var(--m-ink, #1a1a1a)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-1-3-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="5s" keyPoints="0;0;1;1" keyTimes="0;0.84;0.95;1" path="M220 410 L71 410"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="5s" keyTimes="0;0.84;0.856;0.95;1" values="0;0;1;1;0"/></circle><rect width="47.4" height="15.5" x="121.3" y="393.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="145" y="404" font-size="11.5" text-anchor="middle">200 OK</text><rect width="118.86" height="15" x="85.57" y="414.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="145" y="425" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">e2e_latency 0.950 s</text></g></svg>