<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-1-3-title fig-1-3-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 470"><title id="fig-1-3-title">One /generate request through the three processes</title><desc id="fig-1-3-desc">Four lifelines: the client, the tokenizer manager, the scheduler, and the detokenizer. The client posts a five-token prompt. The tokenizer manager sends token ids to the scheduler over ZMQ. The scheduler matches two cached tokens in the radix cache, prefills three, and returns the first token after 889 ms. Eleven decode steps follow, and the detokenizer returns the text, for 950 ms end to end.</desc><defs><marker id="fig-1-3-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-1-3-head-indigo" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-indigo-ink, #4b4f9e)" d="M0 1 L10 5 L0 9 z"/></marker></defs><rect width="110" height="30" x="15" y="10" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/><text x="70" y="28.6" font-size="12" font-weight="700" text-anchor="middle">client</text><line x1="70" x2="70" y1="40" y2="462" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="150" height="30" x="145" y="10" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="220" y="28.6" font-size="12" font-weight="700" text-anchor="middle">TokenizerManager</text><line x1="220" x2="220" y1="40" y2="462" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="150" height="30" x="315" y="10" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="390" y="28.6" font-size="12" font-weight="700" text-anchor="middle">Scheduler</text><line x1="390" x2="390" y1="40" y2="462" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="150" height="30" x="485" y="10" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="560" y="28.6" font-size="12" font-weight="700" text-anchor="middle">Detokenizer</text><line x1="560" x2="560" y1="40" y2="462" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><circle cx="16" cy="74" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="16" y="78" font-size="11" text-anchor="middle">1</text><line x1="70" x2="219" y1="74" y2="74" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-3-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="0.8s" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" path="M70 74 L219 74"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="0.8s" keyTimes="0;0;0.1;0.688;1" values="0;0;1;1;0"/></circle><rect width="102.6" height="15.5" x="93.7" y="57.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="145" y="68" font-size="11.5" text-anchor="middle">POST /generate</text><rect width="148.56" height="15" x="70.72" y="78.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="145" y="89" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">The capital of France is</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><circle cx="16" cy="122" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="16" y="126" font-size="11" text-anchor="middle">2</text><line x1="220" x2="389" y1="122" y2="122" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-width="1.2" marker-end="url(#fig-1-3-head-indigo)"/><circle r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M220 122 L389 122"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="81.9" height="15.5" x="264.05" y="105.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="305" y="116" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11.5" text-anchor="middle">5 token ids</text><rect width="95.1" height="15" x="257.45" y="126.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="305" y="137" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">one ZMQ message</text></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" type="translate" values="0 4;0 4;0 0"/><circle cx="16" cy="170" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><tex