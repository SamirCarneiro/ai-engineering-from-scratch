<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-4-3-title fig-4-3-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 456"><title id="fig-4-3-title">The default attention backend at v0.5.22</title><desc id="fig-4-3-desc">A decision tree. The model attention type splits into MHA on the left and MLA on the right. For MHA: Hopper with CUDA 12.3 gives fa3 because of issue 17411, Blackwell SM100 gives trtllm_mha or fa4 for unequal K and V widths, AMD gives aiter, Apple MPS gives torch_native, and any other GPU gives flashinfer, or triton when the model has attention sinks. For MLA: Hopper gives fa3, Blackwell gives flashinfer, which DeepSeek V3 overrides to trtllm_mla, AMD gives aiter for 16 or 128 KV heads, and others give triton.</desc><defs><marker id="fig-4-3-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker></defs><rect width="280" height="46" x="180" y="20" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="320" y="38.25" font-size="12.5" font-weight="700" text-anchor="middle">get_default_attn_backend</text><text x="320" y="55.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">no --attention-backend given</text><rect width="280" height="46" x="20" y="100" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="160" y="118.25" font-size="12.5" font-weight="700" text-anchor="middle">MHA model</text><text x="160" y="135.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">Llama, Qwen, Gemma</text><rect width="280" height="46" x="340" y="100" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="480" y="118.25" font-size="12.5" font-weight="700" text-anchor="middle">MLA model</text><text x="480" y="135.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">DeepSeek V3, GLM MoE</text><line x1="240" x2="240" y1="66" y2="100" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-3-head-ink)"/><line x1="400" x2="400" y1="66" y2="100" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-3-head-ink)"/><line x1="28" x2="28" y1="146" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="28" x2="36" y1="194" y2="194" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="40" y="198" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">Hopper</text><rect width="152" height="48" x="148" y="170" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="224" y="189.1" font-size="12" font-weight="700" text-anchor="middle">fa3</text><text x="224" y="206.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">issue 17411</text><line x1="28" x2="36" y1="250" y2="250" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="40" y="254" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">Blackwell SM100</text><rect width="152" height="48" x="148" y="226" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="224" y="245.1" font-size="12" font-weight="700" text-anchor="middle">trtllm_mha</text><text x="224" y="262.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">fa4 for unequal K, V</text><line x1="28" x2="36" y1="306" y2="306" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="40" y="310" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">AMD ROCm</text><rect width="152" height="48" x="148" y="282" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="224" y="301.1" font-size="12" font-weight="700" text-anchor="middle">aiter</text><text x="224" y="318.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">all MHA models</text><line x1="28" x2="36" y1="362" y2="362" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="40" y="366" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">Apple MPS</text><rect width="152" height="48" x="148" y="338" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="224" y="357.1" font-size="12" font-weight="700" text-anchor="middle">torch_native</text><text x="224" y="374.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">PyTorch SDPA</text><line x1="28" x2="36" y1="418" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="40" y="422" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">other GPUs</text><rect width="152" height="48" x="148" y="394" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="224" y="413.1" font-size="12" font-weight="700" text-anchor="middle">flashinfer</text><text x="224" y="430.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">triton with sinks</text><line x1="348" x2="348" y1="146" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="348" x2="356" y1="194" y2="194" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="360" y="198" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">Hopper</text><rect width="152" height="48" x="468" y="170" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="544" y="189.1" font-size="12" font-weight="700" text-anchor="middle">fa3</text><text x="544" y="206.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">same as MHA</text><line x1="348" x2="356" y1="250" y2="250" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="360" y="254" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">Blackwell SM100</text><rect width="152" height="48" x="468" y="226" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="544" y="245.1" font-size="12" font-weight="700" text-anchor="middle">flashinfer</text><text x="544" y="262.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">DeepSeek V3 override</text><line x1="348" x2="356" y1="306" y2="306" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="360" y="310" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">AMD ROCm</text><rect width="152" height="48" x="468" y="282" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="544" y="301.1" font-size="12" font-weight="700" text-anchor="middle">aiter</text><text x="544" y="318.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">if 16 or 128 KV heads</text><line x1="348" x2="356" y1="362" y2="362" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="360" y="366" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">Apple MPS</text><rect width="152" height="48" x="468" y="338" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="544" y="357.1" font-size="12" font-weight="700" text-anchor="middle">torch_native</text><text x="544" y="374.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">PyTorch SDPA</text><line x1="348" x2="356" y1="418" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><text x="360" y="422" fill="var(--m-ink-soft, #4a4a4a)" font-size="11">other GPUs</text><rect width="152" height="48" x="468" y="394" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="544" y="413.1" font-size="12" font-weight="700" text-anchor="middle">triton</text><text x="544" y="430.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">portable kernels</text></svg>