<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-5-1f-title fig-5-1f-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 340"><title id="fig-5-1f-title">The same server on the same L4, measured hot and measured with a cool-down</title><desc id="fig-5-1f-desc">Output throughput of Qwen3-8B on one NVIDIA L4 against concurrency, in two sweeps with the same command. The first sweep ran with the card near 87 C and no telemetry. The second waited for 72 C before each run and recorded the clock. The cooled sweep is higher at every point, by up to 39 percent at concurrency 32, and it falls at 64 when the KV pool is full.</desc><line x1="66" x2="606" y1="286" y2="286" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="290" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">0</text><line x1="66" x2="606" y1="209.33" y2="209.33" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="213.33" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">100</text><line x1="66" x2="606" y1="132.67" y2="132.67" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="136.67" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">200</text><line x1="66" x2="606" y1="56" y2="56" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="60" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">300</text><line x1="66" x2="606" y1="286" y2="286" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><line x1="66" x2="66" y1="56" y2="286" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><line x1="66" x2="66" y1="286" y2="290" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="66" y="303" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">1</text><line x1="156" x2="156" y1="286" y2="290" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/