<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-4-4b-title fig-4-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 350"><title id="fig-4-4b-title">On a mixture-of-experts model the EAGLE-3 gain grows with the batch</title><desc id="fig-4-4b-desc">Speedup of median time per output token with EAGLE-3 over the BF16 default for Qwen3-30B-A3B on a GB10. It is 1.60 times at concurrency 1, rises to 1.89 at 32 and is 1.84 at 64, while the accept length stays near 2.7 tokens per step.</desc><line x1="66" x2="606" y1="276" y2="276" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="280" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">x0</text><line x1="66" x2="606" y1="202.67" y2="202.67" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="206.67" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">x1</text><line x1="66" x2="606" y1="129.33" y2="129.33" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="133.33" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">x2</text><line x1="66" x2="606" y1="56" y2="56" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity=".25" stroke-width="1"/><text x="60" y="60" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="end">x3</text><line x1="66" x2="606" y1="276" y2="276" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><line x1="66" x2="66" y1="56" y2="276" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><line x1="66" x2="66" y1="276" y2="280" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="66" y="293" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">1</text><line x1="156" x2="156" y1="276" y2="280" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="156" y="293" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">2</text><line x1="246" x2="246" y1="276" y2="280" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="246" y="293" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">4</text><line x1="336" x2="336" y1="276" y2="280" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="336" y="293" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">8</text><line x1="426" x2="426" y1="276" y2="280" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="426" y="293" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">16</text><line x1="516" x2="516" y1="276" y2="280" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="516" y="293" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">32</text><line x1="606" x2="606" y1="276" y2="280" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="606" y="293" fill="var(--m-ink-soft, #4a4a4a)" font-size="11" text-anchor="middle">64</text><text x="336" y="310" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11.5" text-anchor="middle">max concurrency (benchmark client)</text><text x="66" y="44" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11.5">default TPOT divided by EAGLE-3 TPOT</text><line x1="66" x2="606" y1="202.67" y2="202.67" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1"/><text x="602" y="218.67" fill="var(--m-rose-ink, #b0344d)" class="m-serif" font-size="11" text-anchor="end">no gain</text><path fill="none" stroke="var(--m-violet-ink, #5b4fa3)" stroke-linejoin="round" stroke-width="1.8" d="M66.0 158.5 L156.0 161.8 L246.0 156.0 L336.0 149.9 L426.0 139.1 L516.0 137.6 L606.0 141.4"/><circle cx="66" cy="158.52" r="2.8" fill="var(--m-violet-ink, #5b4fa3)"/><circle cx="156" cy="161.78" r="2.8" fill="var(--m-violet-ink, #5b4fa3)"/><circle cx="246" cy="155.96" r="2.8" fill="var(--m-violet-ink, #5b4fa3)"/><circle cx="336" cy="149.9" r="2.8" fill="var(--m-violet-ink, #5b4fa3)"/><circle cx="426" cy="139.1" r="2.8" fill="var(--m-violet-ink, 