<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-5-3-title fig-5-3-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 420"><title id="fig-5-3-title">Six questions to ask a published SGLang benchmark</title><desc id="fig-5-3-desc">Six questions in a column: version stated, workload matches yours, memory budgets matched, concurrency under the graph limit, flags mapped across engines, and who paid. A no on any question leads right to what the result can still tell you. Six yes answers lead to testing the mechanism on your own server.</desc><defs><marker id="fig-5-3-head-rose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-rose-ink, #b0344d)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-5-3-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker></defs><rect width="300" height="34" x="20" y="20" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><text x="170" y="40.6" font-size="12" font-weight="700" text-anchor="middle">1 · SGLang version stated?</text><line x1="320" x2="372" y1="37" y2="37" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-3-head-rose)"/><rect width="19.8" height="15.5" x="336.1" y="20.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="346" y="31" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">no</text><text x="380" y="41" fill="var(--m-rose-ink, #b0344d)" class="m-serif" font-size="11">an unknown build: anecdote only</text><line x1="170" x2="170" y1="54" y2="77" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-3-head-ink)"/><rect width="300" height="34" x="20" y="78" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><text x="170" y="98.6" font-size="12" font-weight="700" text-anchor="middle">2 · workload matches yours?</text><line x1="320" x2="372" y1="95" y2="95" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-3-head-rose)"/><rect width="19.8" height="15.5" x="336.1" y="78.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="346" y="89" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">no</text><text x="380" y="99" fill="var(--m-rose-ink, #b0344d)" class="m-serif" font-size="11">describes another workload</text><line x1="170" x2="170" y1="112" y2="135" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-3-head-ink)"/><rect width="300" height="34" x="20" y="136" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><text x="170" y="156.6" font-size="12" font-weight="700" text-anchor="middle">3 · memory budgets matched?</text><line x1="320" x2="372" y1="153" y2="153" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-3-head-rose)"/><rect width="19.8" height="15.5" x="336.1" y="136.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="346" y="147" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">no</text><text x="380" y="157" fill="var(--m-rose-ink, #b0344d)" class="m-serif" font-size="11">compares two KV pool sizes</text><line x1="170" x2="170" y1="170" y2="193" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-3-head-ink)"/><rect width="300" height="34" x="20" y="194" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><text x="170" y="214.6" font-size="12" font-weight="700" text-anchor="middle">4 · concurrency under graph limit?</text><line x1="320" x2="372" y1="211" y2="211" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-3-head-rose)"/><rect width="19.8" height="15.5" x="336.1" y="194.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="346" y="205" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">no</text><text x="380" y="215" fill="var(--m-rose-ink, #b0344d)" class="m-serif" font-size="11">measured eager decode</text><line x1="170" x2="170" y1="228" y2="251" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-3-head-ink)"/><rect width="300" height="34" x="20" y="252" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><text x="170" y="272.6" font-size="12" font-weight="700" text-anchor="middle">5 · flags mapped across engines?</text><line x1="320" x2="372" y1="269" y2="269" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-3-head-rose)"/><rect width="19.8" height="15.5" x="336.1" y="252.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="346" y="263" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">no</text><text x="380" y="273" fill="var(--m-rose-ink, #b0344d)" class="m-serif" font-size="11">a flag error can decide it</text><line x1="170" x2="170" y1="286" y2="309" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-3-head-ink)"/><rect width="300" height="34" x="20" y="310" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><text x="170" y="330.6" font-size="12" font-weight="700" text-anchor="middle">6 · who paid is stated?</text><line x1="320" x2="372" y1="327" y2="327" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-5-3-head-rose)"/><rect width="19.8" height="15.5" x="336.1" y="310.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="346" y="321" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">no</text><text x="380" y="331" fill="var(--m-rose-ink, #b0344d)" class="m-serif" font-size="11">read it as that party&apos;s claim</text><line x1="170" x2="170" y1="344" y2="369" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-3-head-ink)"/><rect width="26.7" height="15.5" x="175" y="345.53" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="178" y="356.5" font-size="11.5">yes</text><rect width="300" height="40" x="20" y="370" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/><text x="170" y="393.6" font-size="12" font-weight="700" text-anchor="middle">test the mechanism on your server</text></svg>