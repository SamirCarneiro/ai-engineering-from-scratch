<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-task-endings-title fig-task-endings-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 492"><title id="fig-task-endings-title">Four ways a task ends</title><desc id="fig-task-endings-desc">Four cards, one per terminal state from the kit. Completed: test-runner task 3d8f7801, chosen by the agent because the suite ran, status message 1 failed, 11 passed, with test-log.txt and summary.json. Failed: task 8ae21dcb, chosen by the agent because commit deadbee does not exist, no artifacts. Canceled: task f22ed7af, chosen by the client with CancelTask, two log chunks kept. Rejected: deployer task 23cf3710, refused by policy, no artifacts. Below, a message to the canceled task gets UnsupportedOperationError and a second cancel gets TaskNotCancelableError.</desc><defs><marker id="fig-task-endings-head-rose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-rose-ink, #b0344d)" d="M0 1 L10 5 L0 9 z"/></marker></defs><text x="20" y="16" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">FOUR TERMINAL STATES FROM THE KIT</text><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><rect width="290" height="42" x="20" y="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><rect width="284" height="36" x="23" y="31" fill="none" stroke="var(--m-amber-ink, #85590c)"/><text x="165" y="44.25" font-size="12.5" font-weight="700" text-anchor="middle">TASK_STATE_COMPLETED</text><text x="165" y="61.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">test-runner, task 3d8f7801</text><text x="24" y="88" fill="var(--m-blue-ink, #2f5d9a)" font-size="11.5">chosen by the agent: the suite ran</text><rect width="290" height="62" x="20" y="98" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="123.8" font-size="11" font-weight="700">status message</text><text x="32" y="140.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">1 failed, 11 passed</text><text x="24" y="180" fill="var(--m-green-ink, #336b40)" font-size="11.5">artifacts: test-log.txt, summary.json</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><rect width="290" height="42" x="330" y="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><rect width="284" height="36" x="333" y="31" fill="none" stroke="var(--m-amber-ink, #85590c)"/><text x="475" y="44.25" font-size="12.5" font-weight="700" text-anchor="middle">TASK_STATE_FAILED</text><text x="475" y="61.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">test-runner, task 8ae21dcb</text><text x="334" y="88" fill="var(--m-blue-ink, #2f5d9a)" font-size="11.5">chosen by the agent: no such commit</text><rect width="290" height="62" x="330" y="98" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="342" y="116.3" font-size="11" font-weight="700">status message</text><text x="342" y="133.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">Commit deadbee does not exist in</text><text x="342" y="148.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">payments-api.</text><text x="334" y="180" fill="var(--m-green-ink, #336b40)" font-size="11.5">artifacts: none</text></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" type="translate" values="0 4;0 4;0 0"/><rect width="290" height="42" x="20" y="206" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><rect width="284" height="36" x="23" y="209" fill="none" stroke="var(--m-amber-ink, #85590c)"/><text x="165" y="222.25" font-size="12.5" font-weight="700" text-anchor="middle">TASK_STATE_CANCELED</text><text x="165" y="239.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">test-runner, task f22ed7af</text><text x="24" y="266" fill="var(--m-violet-ink, #5b4fa3)" font-size="11.5">chosen by the client: CancelTask</text><rect width="290" height="62" x="20" y="276" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="301.8" font-size="11" font-weight="700">status message</text><text x="32" y="318.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">Canceled at the client&apos;s request.</text><text x="24" y="358" fill="var(--m-green-ink, #336b40)" font-size="11.5">artifacts: test-log.txt, two chunks</text></g><g data-beat="4"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" type="translate" values="0 4;0 4;0 0"/><rect width="290" height="42" x="330" y="206" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><rect width="284" height="36" x="333" y="209" fill="none" stroke="var(--m-amber-ink, #85590c)"/><text x="475" y="222.25" font-size="12.5" font-weight="700" text-anchor="middle">TASK_STATE_REJECTED</text><text x="475" y="239.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">deployer, task 23cf3710</text><text x="334" y="266" fill="var(--m-blue-ink, #2f5d9a)" font-size="11.5">chosen by the agent: its policy</text><rect width="290" height="62" x="330" y="276" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="342" y="294.3" font-size="11" font-weight="700">status message</text><text x="342" y="311.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">Production deploys are outside this agent&apos;s</text><text x="342" y="326.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">policy. Use the release train.</text><text x="334" y="358" fill="var(--m-green-ink, #336b40)" font-size="11.5">artifacts: none</text></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><line x1="20" x2="620" y1="384" y2="384" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4" stroke-width="1"/><text x="20" y="400" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">AFTER THE END</text><text x="140" y="400" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">calls to the canceled task f22ed7af, from 10-cancel.http</text><rect width="250" height="30" x="20" y="410" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="145" y="428.45" font-size="11.5" font-weight="700" text-anchor="middle">SendMessage, taskId f22ed7af</text><line x1="270" x2="329" y1="425" y2="425" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-task-endings-head-rose)"/><circle r="3.5" fill="var(--m-rose-ink, #b0344d)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.2s" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" path="M270 425 L329 425"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.2s" keyTimes="0;0.75;0.775;0.922;1" values="0;0;1;1;0"/></circle><rect width="290" height="30" x="330" y="410" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="475" y="428.45" font-size="11.5" font-weight="700" text-anchor="middle">UnsupportedOperationError, -32004</text></g><g data-beat="6"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" type="translate" values="0 4;0 4;0 0"/><rect width="250" height="30" x="20" y="452" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="145" y="470.45" font-size="11.5" font-weight="700" text-anchor="middle">CancelTask, a second time</text><line x1="270" x2="329" y1="467" y2="467" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-task-endings-head-rose)"/><circle r="3.5" fill="var(--m-rose-ink, #b0344d)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.8s" keyPoints="0;0;1;1" keyTimes="0;0.789;0.934;1" path="M270 467 L329 467"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.8s" keyTimes="0;0.789;0.811;0.934;1" values="0;0;1;1;0"/></circle><rect width="290" height="30" x="330" y="452" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="475" y="470.45" font-size="11.5" font-weight="700" text-anchor="middle">TaskNotCancelableError, -32002</text></g></svg>