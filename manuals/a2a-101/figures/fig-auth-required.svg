<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-auth-required-title fig-auth-required-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 468"><title id="fig-auth-required-title">A deploy that waits for an operator</title><desc id="fig-auth-required-desc">A sequence with three lifelines: the planner, the deployer agent, and an operator outside A2A. The planner opens a stream with SendStreamingMessage. Frames 1 to 3 carry the task in TASK_STATE_SUBMITTED, TASK_STATE_WORKING, and TASK_STATE_AUTH_REQUIRED with an approval link. The stream stays open with no frames while the operator posts to the approval endpoint over plain HTTP. Then frames 4 to 6 carry TASK_STATE_WORKING, the deploy-report.json artifact, and TASK_STATE_COMPLETED, and the stream closes.</desc><defs><marker id="fig-auth-required-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-auth-required-head-indigo" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-indigo-ink, #4b4f9e)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-auth-required-head-olive" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-olive-ink, #515f26)" d="M0 1 L10 5 L0 9 z"/></marker></defs><rect width="150" height="38" x="25" y="8" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="100" y="22.25" font-size="12.5" font-weight="700" text-anchor="middle">planner</text><text x="100" y="39.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">client agent</text><line x1="100" x2="100" y1="46" y2="456" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="150" height="38" x="275" y="8" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="350" y="22.25" font-size="12.5" font-weight="700" text-anchor="middle">deployer</text><text x="350" y="39.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">remote agent</text><line x1="350" x2="350" y1="46" y2="456" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="150" height="38" x="481" y="8" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/><text x="556" y="22.25" font-size="12.5" font-weight="700" text-anchor="middle">operator</text><text x="556" y="39.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">outside A2A</text><line x1="556" x2="556" y1="46" y2="456" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><circle cx="24" cy="84" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="24" y="88" font-size="11" text-anchor="middle">1</text><line x1="100" x2="349" y1="84" y2="84" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-auth-required-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="0.8s" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" path="M100 84 L349 84"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="0.8s" keyTimes="0;0;0.1;0.688;1" values="0;0;1;1;0"/></circle><rect width="144" height="15.5" x="153" y="67.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="225" y="78" font-size="11.5" text-anchor="middle">SendStreamingMessage</text><rect width="184.2" height="15" x="132.9" y="88.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="225" y="99" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">deploy 2026.10.06-1 to staging</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><circle cx="24" cy="128" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="24" y="132" font-size="11" text-anchor="middle">2</text><line x1="350" x2="101" y1="128" y2="128" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-width="1.2" marker-end="url(#fig-auth-required-head-indigo)"/><circle r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M350 128 L101 128"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="185.4" height="15.5" x="132.3" y="111.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="225" y="122" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11.5" text-anchor="middle">task, TASK_STATE_SUBMITTED</text><rect width="47.58" height="15" x="201.21" y="132.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="225" y="143" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">frame 1</text></g><g data