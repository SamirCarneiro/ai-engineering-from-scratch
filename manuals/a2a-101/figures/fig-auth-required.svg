fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="24" y="220" font-size="11" text-anchor="middle">4</text><line x1="350" x2="101" y1="216" y2="216" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-width="1.2" marker-end="url(#fig-auth-required-head-indigo)"/><circle r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="2.6s" keyPoints="0;0;1;1" keyTimes="0;0.692;0.904;1" path="M350 216 L101 216"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="2.6s" keyTimes="0;0.692;0.723;0.904;1" values="0;0;1;1;0"/></circle><rect width="171.6" height="15.5" x="139.2" y="199.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="225" y="210" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11.5" text-anchor="middle">TASK_STATE_AUTH_REQUIRED</text><rect width="207.96" height="15" x="121.02" y="220.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="225" y="231" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">frame 3: link to /approve/ecf2dcb6</text><line x1="112" x2="112" y1="238" y2="332" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="1.5 3.5" stroke-width="1.6"/><text x="124" y="286" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11">the stream stays open,</text><text x="124" y="301" fill="var(--m-indigo-ink, #4b4f9e)" font-size="11">no frames while it waits</text></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><circle cx="24" cy="260" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-in