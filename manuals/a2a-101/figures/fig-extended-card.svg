Motion fill="freeze" begin="indefinite" calcMode="linear" dur="2.6s" keyPoints="0;0;1;1" keyTimes="0;0.692;0.904;1" path="M548 228 L263 228"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="2.6s" keyTimes="0;0.692;0.723;0.904;1" values="0;0;1;1;0"/></circle><rect width="150.9" height="15.5" x="329.55" y="211.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405" y="222" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">HTTP 401 Unauthorized</text><rect width="249.54" height="15" x="280.23" y="232.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405" y="243" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">WWW-Authenticate: Bearer realm=&quot;deployer&quot;</text></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><circle cx="20" cy="276" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="20" y="280" font-size="11" text-anchor="middle">5</text><line x1="84" x2="261" y1="276" y2="276" stroke="var(--m-olive-ink, #515f26)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-extended-card-head-olive)"/><circle r="3.5" fill="var(--m-olive-ink, #515f26)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.2s" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" path="M84 276 L261 276"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.2s" keyTimes="0;0.75;0.775;0.922;1" values="0;0;1;1;0"/></circle><rect width="88.8" height="15.5" x="128.6" y="259.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="173" y="270" fill="var(--m-olive-ink, #515f26)" font-size="11.5" text-anchor="middle">bearer token</text><rect width="112.92" height="15" x="116.54" y="280.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="173" y="291" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">issued outside A2A</text></g><g data-beat="6"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" type="translate" values="0 4;0 4;0 0"/><circle cx="20" cy="324" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="20" y="328" font-size="11" text-anchor="middle">6</text><line x1="262" x2="547" y1="324" y2="324" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-extended-card-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.8s" keyPoints="0;0;1;1" keyTimes="0;0.789;0.934;1" path="M262 324 L547 324"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.8s" keyTimes="0;0.789;0.811;0.934;1" values="0;0;1;1;0"/></circle><rect width="144" height="15.5" x="333" y="307.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405" y="318" font-size="11.5" text-anchor="middle">GetExtendedAgentCard</text><rect width="225.78" height="15" x="292.11" y="328.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405" y="339" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">Authorization: Bearer dpl_test_7c1e4b</text></g><g data-beat="7"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="