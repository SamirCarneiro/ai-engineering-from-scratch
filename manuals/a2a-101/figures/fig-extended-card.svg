<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-extended-card-title fig-extended-card-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 420"><title id="fig-extended-card-title">Earning the extended card</title><desc id="fig-extended-card-desc">Three lifelines: the platform team outside A2A, the planner, and the deployer. Seven steps appear in order. The planner reads the public card, which declares extendedAgentCard true and a bearer scheme. It calls GetExtendedAgentCard without an Authorization header and gets HTTP 401 with WWW-Authenticate: Bearer realm=&quot;deployer&quot;. The platform team issues a bearer token outside A2A. The planner calls again with the token and receives the extended card, whose skills are deploy and rollback and which carries no signature.</desc><defs><marker id="fig-extended-card-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-extended-card-head-rose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-rose-ink, #b0344d)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-extended-card-head-olive" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-olive-ink, #515f26)" d="M0 1 L10 5 L0 9 z"/></marker></defs><rect width="132" height="40" x="18" y="10" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/><text x="84" y="25.1" font-size="12" font-weight="700" text-anchor="middle">platform team</text><text x="84" y="42.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">outside A2A</text><line x1="84" x2="84" y1="50" y2="408" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="132" height="40" x="196" y="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="262" y="25.1" font-size="12" font-weight="700" text-anchor="middle">planner</text><text x="262" y="42.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">client</text><line x1="262" x2="262" y1="50" y2="408" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><rect width="132" height="40" x="482" y="10" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="548" y="25.1" font-size="12" font-weight="700" text-anchor="middle">deployer</text><text x="548" y="42.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">port 41243</text><line x1="548" x2="548" y1="50" y2="408" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="2 3" stroke-width="1"/><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><circle cx="20" cy="84" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="20" y="88" font-size="11" text-anchor="middle">1</text><line x1="262" x2="547" y1="84" y2="84" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-extended-card-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="0.8s" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" path="M262 84 L547 84"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="0.8s" keyTimes="0;0;0.1;0.688;1" values="0;0;1;1;0"/></circle><rect width="226.8" height="15.5" x="291.6" y="67.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405" y="78" font-size="11.5" text-anchor="middle">GET /.well-known/agent-card.json</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><circle cx="20" cy="132" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/><text x="20" y="136" font-size="11" text-anchor="middle">2</text><line x1="548" x2="263" y1="132" y2="132" stroke="var(--m-ink, #1a1a1a)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-extended-card-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M548 132 L263 132"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="81.9" height="15.5" x="364.05" y="115.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405" y="126" font-size="11.5" text-anchor="middle">public card</text><rect width="231.72" height="15" x="289.14" y="136.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="405" y="147" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">extendedAgentCard: true, scheme bearer</text></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySpline