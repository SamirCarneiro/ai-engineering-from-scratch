<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-card-signature-title fig-card-signature-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 450"><title id="fig-card-signature-title">Signing and verifying the deployer card</title><desc id="fig-card-signature-desc">Top half, signing, in three steps: the deployer card minus its signatures field is canonicalized with RFC 8785 into a 959-byte payload. The protected header {&quot;alg&quot;:&quot;HS256&quot;,&quot;typ&quot;:&quot;JOSE&quot;,&quot;kid&quot;:&quot;deployer-key-1&quot;} and the payload are each base64url-encoded and joined with a period into a 1,348-character signing input, which HMAC-SHA256 signs to give signatures[0] with protected eyJhbGci and signature yPk834ji. Bottom half, verifying, in four steps: the published card rebuilds the same payload and its signature matches, so verification returns True. An edited copy whose description reads &quot;Deploys a tagged build to production.&quot; rebuilds a different payload, and verification returns False.</desc><defs><marker id="fig-card-signature-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-card-signature-head-rose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-rose-ink, #b0344d)" d="M0 1 L10 5 L0 9 z"/></marker></defs><text x="20" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">SIGN</text><text x="20" y="300" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">VERIFY</text><rect width="170" height="58" x="20" y="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="105" y="46.6" font-size="12" font-weight="700" text-anchor="middle">deployer card</text><text x="105" y="63.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">11 members,</text><text x="105" y="78.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">plus signatures</text><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><rect width="340" height="58" x="280" y="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="450" y="46.6" font-size="12" font-weight="700" text-anchor="middle">canonical payload, RFC 8785</text><text x="450" y="63.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">sorted keys, no spaces, no signatures</text><text x="450" y="78.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">959 bytes, from capabilities to version</text><line x1="190" x2="279" y1="59" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-card-signature-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="0.8s" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" path="M190 59 L279 59"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="0.8s" keyTimes="0;0;0.1;0.688;1" values="0;0;1;1;0"/></circle><rect width="85.2" height="15" x="191.9" y="42.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="234.5" y="53" font-size="11" text-anchor="middle">canonicalize</text><rect width="77.28" height="15" x="195.86" y="63.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="234.5" y="74" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">rules 1 to 3</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><rect width="230" height="58" x="20" y="118" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="138" font-size="12" font-weight="700">protected header</text><text x="32" y="154" font-size="11">{&quot;alg&quot;:&quot;HS256&quot;,&quot;typ&quot;:&quot;JOSE&quot;,</text><text x="32" y="169" font-size="11">&quot;kid&quot;:&quot;deployer-key-1&quot;}</text><rect width="290" height="58" x="330" y="118" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="475" y="134.6" font-size="12" font-weight="700" text-anchor="middle">JWS signing input</text><text x="475" y="151.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">BASE64URL(header) &apos;.&apos; BASE64URL(payload)</text><text x="475" y="166.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">1,348 characters on one line</text><line x1="250" x2="329" y1="147" y2="147" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-card-signature-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M250 147 L329 147"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="65.4" height="15" x="256.8" y="130.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="289.5" y="141" font-size="11" text-anchor="middle">base64url</text><line x1="475" x2="475" y1="88" y2="117" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-card-signature-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M475 88 L475 117"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="65.4" height="15" x="480" y="91.92" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="483" y="102.5" font-size="11">base64url</text></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" type="translate" values="0 4;0 4;0 0"/><rect width="290" height="58" x="330" y="206" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="342" y="226" font-size="12" font-weight="700">signatures[0]</text><text x="342" y="242" font-size="11">protected &quot;eyJhbGci&quot;</text><text x="342" y="257" font-size="11">signature &quot;yPk834ji&quot;</text><line x1="475" x2="475" y1="176" y2="205" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-card-signature-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="2s" keyPoints="0;0;1;1" keyTimes="0;0.6;0.875;1" path="M475 176 L475 205"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="2s" keyTimes="0;0.6;0.64;0.875;1" values="0;0;1;1;0"/></circle><rect width="78.6" height="15" x="480" y="179.92" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="483" y="190.5" font-size="11">HMAC-SHA256</text><text x="467" y="194" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="end">HS256, key deployer-key-1</text><rect width="280" height="58" x="20" y="206" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/><text x="160" y="221.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">the kit: HS256, one shared key</text><text x="160" y="236.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">real cards: ES256 or RS256, with</text><text x="160" y="251.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">a public key in a JWKS at jku</text></g><g data-beat="4"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" type="translate" values="0 4;0 4;0 0"/><rect width="210" height="46" x="20" y="312" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="125" y="330.1" font-size="12" font-weight="700" text-anchor="middle">published card</text><text x="125" y="347.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">description as signed</text><rect width="160" height="46" x="290" y="312" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="302" y="332" font-size="12" font-weight="700">recompute</text><text x="302" y="348" font-size="11">&quot;yPk834ji&quot;</text><line x1="230" x2="289" y1="335" y2="335" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-card-signature-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="2.6s" keyPoints="0;0;1;1" keyTimes="0;0.692;0.904;1" path="M230 335 L289 335"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="2.6s" keyTimes="0;0.692;0.723;0.904;1" values="0;0;1;1;0"/></circle><rect width="52.2" height="15" x="233.4" y="318.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="259.5" y="329" font-size="11" text-anchor="middle">rebuild</text></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><rect width="110" height="46" x="510" y="312" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="565" y="330.1" font-size="12" font-weight="700" text-anchor="middle">True</text><text x="565" y="347.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">step 5</text><line x1="450" x2="509" y1="335" y2="335" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-card-signature-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.2s" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" path="M450 335 L509 335"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.2s" keyTimes="0;0.75;0.775;0.922;1" values="0;0;1;1;0"/></circle><rect width="39" height="15" x="460" y="318.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="479.5" y="329" font-size="11" text-anchor="middle">match</text></g><g data-beat="6"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" type="translate" values="0 4;0 4;0 0"/><rect width="210" height="58" x="20" y="380" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)" stroke-dasharray="5 4"/><text x="125" y="396.6" font-size="12" font-weight="700" text-anchor="middle">edited copy</text><text x="125" y="413.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">&quot;Deploys a tagged build</text><text x="125" y="428.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">to production.&quot;</text><rect width="160" height="58" x="290" y="380" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="302" y="400" font-size="12" font-weight="700">recompute</text><text x="302" y="416" font-size="11">new payload,</text><text x="302" y="431" font-size="11">another value</text><line x1="230" x2="289" y1="409" y2="409" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-card-signature-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.8s" keyPoints="0;0;1;1" keyTimes="0;0.789;0.934;1" path="M230 409 L289 409"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.8s" keyTimes="0;0.789;0.811;0.934;1" values="0;0;1;1;0"/></circle><rect width="52.2" height="15" x="233.4" y="392.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="259.5" y="403" font-size="11" text-anchor="middle">rebuild</text></g><g data-beat="7"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" type="translate" values="0 4;0 4;0 0"/><rect width="110" height="58" x="510" y="380" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="565" y="404.1" font-size="12" font-weight="700" text-anchor="middle">False</text><text x="565" y="421.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">step 6</text><line x1="450" x2="509" y1="409" y2="409" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-card-signature-head-rose)"/><circle r="3.5" fill="var(--m-rose-ink, #b0344d)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="4.4s" keyPoints="0;0;1;1" keyTimes="0;0.818;0.943;1" path="M450 409 L509 409"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="4.4s" keyTimes="0;0.818;0.836;0.943;1" values="0;0;1;1;0"/></circle><rect width="52.2" height="15" x="453.4" y="392.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="479.5" y="403" fill="var(--m-rose-ink, #b0344d)" font-size="11" text-anchor="middle">differs</text></g></svg>