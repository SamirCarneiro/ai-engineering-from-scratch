<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-finding-an-agent-title fig-finding-an-agent-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 462"><title id="fig-finding-an-agent-title">From a host to a checked call</title><desc id="fig-finding-an-agent-desc">Three stages, top to bottom, drawn step by step. First, the planner finds the code-reviewer card: direct configuration gives it the host, and a GET of /.well-known/agent-card.json returns the card, while a registry is a third route the kit does not use. Second, the planner takes interface 0, JSON-RPC 1.0 at /a2a/jsonrpc, and skips interface 1, HTTP+JSON. Third, it reads the capability flags: streaming is true and pushNotifications is absent, and a CreateTaskPushNotificationConfig call that ignores the absent flag fails with error -32003.</desc><defs><marker id="fig-finding-an-agent-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-finding-an-agent-head-grey" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-grey-ink, #5e5e59)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-finding-an-agent-head-rose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-rose-ink, #b0344d)" d="M0 1 L10 5 L0 9 z"/></marker></defs><text x="20" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">1 · FIND THE CARD</text><text x="20" y="176" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">2 · TAKE THE FIRST INTERFACE YOU SPEAK</text><text x="20" y="284" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">3 · CHECK THE FLAG BEFORE AN OPTIONAL CALL</text><rect width="180" height="46" x="20" y="35" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="110" y="53.1" font-size="12" font-weight="700" text-anchor="middle">direct configuration</text><text x="110" y="70.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">ports 41241, 41242, 41243</text><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><rect width="150" height="60" x="245" y="28" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="320" y="45.6" font-size="12" font-weight="700" text-anchor="middle">well-known URI</text><text x="320" y="62.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">GET /.well-known/</text><text x="320" y="77.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">agent-card.json</text><line x1="200" x2="244" y1="58" y2="58" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-finding-an-agent-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="0.8s" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" path="M200 58 L244 58"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="0.8s" keyTimes="0;0;0.1;0.688;1" values="0;0;1;1;0"/></circle><rect width="26.7" height="15.5" x="208.65" y="41.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="222" y="52" font-size="11.5" text-anchor="middle">GET</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><rect width="160" height="46" x="460" y="35" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="540" y="53.1" font-size="12" font-weight="700" text-anchor="middle">code-reviewer</text><text x="540" y="70.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">agent card</text><line x1="395" x2="459" y1="58" y2="58" stroke="var(--m-ink, #1a1a1a)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-finding-an-agent-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M395 58 L459 58"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="47.4" height="15.5" x="403.3" y="41.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="427" y="52" font-size="11.5" text-anchor="middle">200 OK</text></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" type="translate" values="0 4;0 4;0 0"/><rect width="180" height="46" x="20" y="100" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/><text x="110" y="118.1" font-size="12" font-weight="700" text-anchor="middle">registry or catalog</text><text x="110" y="135.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">no standard query API</text><path fill="none" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4" stroke-linejoin="round" stroke-width="1.2" marker-end="url(#fig-finding-an-agent-head-grey)" d="M200 123 H430 V72 H459"/><rect width="118.86" height="15" x="255.57" y="116.42" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="315" y="127" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">or a registry query</text></g><g data-beat="4"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" type="translate" values="0 4;0 4;0 0"/><line x1="540" x2="540" y1="81" y2="188" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4" stroke-width="1"/><rect width="600" height="30" x="20" y="188" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="32" y="207" font-size="11">[0] JSONRPC, &quot;1.0&quot;, http://localhost:41242/a2a/jsonrpc</text><text x="610" y="207" fill="var(--m-violet-ink, #5b4fa3)" class="m-serif" font-size="11" font-weight="700" text-anchor="end">chosen</text><rect width="600" height="30" x="20" y="224" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/><text x="32" y="243" fill="var(--m-ink-mute, #6f6f6a)" font-size="11">[1] HTTP+JSON, &quot;1.0&quot;, http://localhost:41242/a2a/rest</text><text x="610" y="243" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="end">skipped: not JSON-RPC</text></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><rect width="290" height="46" x="20" y="294" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="165" y="312.1" font-size="12" font-weight="700" text-anchor="middle">streaming: true</text><text x="165" y="329.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">SendStreamingMessage, SubscribeToTask</text><rect width="290" height="46" x="330" y="294" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)" stroke-dasharray="5 4"/><text x="475" y="312.1" font-size="12" font-weight="700" text-anchor="middle">pushNotifications: absent</text><text x="475" y="329.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">the four push config operations fail</text></g><g data-beat="6"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" type="translate" values="0 4;0 4;0 0"/><text x="20" y="368" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">exchange 6 of 11-errors.http calls one anyway:</text><rect width="110" height="72" x="20" y="380" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="75" y="411.1" font-size="12" font-weight="700" text-anchor="middle">planner</text><text x="75" y="428.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">client</text><rect width="130" height="72" x="490" y="380" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="555" y="411.1" font-size="12" font-weight="700" text-anchor="middle">code-reviewer</text><text x="555" y="428.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">/a2a/jsonrpc</text><line x1="130" x2="489" y1="400" y2="400" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-finding-an-agent-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.8s" keyPoints="0;0;1;1" keyTimes="0;0.789;0.934;1" path="M130 400 L489 400"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.8s" keyTimes="0;0.789;0.811;0.934;1" values="0;0;1;1;0"/></circle><rect width="226.8" height="15.5" x="196.1" y="383.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="309.5" y="394" font-size="11.5" text-anchor="middle">CreateTaskPushNotificationConfig</text></g><g data-beat="7"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="4.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.889;1" type="translate" values="0 4;0 4;0 0"/><line x1="490" x2="131" y1="436" y2="436" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-finding-an-agent-head-rose)"/><circle r="3.5" fill="var(--m-rose-ink, #b0344d)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="4.4s" keyPoints="0;0;1;1" keyTimes="0;0.818;0.943;1" path="M490 436 L131 436"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="4.4s" keyTimes="0;0.818;0.836;0.943;1" values="0;0;1;1;0"/></circle><rect width="268.2" height="15.5" x="176.4" y="419.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="310.5" y="430" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">-32003 PUSH_NOTIFICATION_NOT_SUPPORTED</text></g></svg>