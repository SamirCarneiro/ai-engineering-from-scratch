<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-agent-card-fields-title fig-agent-card-fields-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 556"><title id="fig-agent-card-fields-title">The test-runner agent card, field by field</title><desc id="fig-agent-card-fields-desc">The agent card that test-runner serves at /.well-known/agent-card.json, drawn as rows under four headings that appear one after another. Who it is: name, description, provider and version, with documentationUrl, iconUrl and signatures not set. Where to reach it: two supportedInterfaces, JSON-RPC first and HTTP+JSON second. What it demands: capabilities with streaming and pushNotifications true, and no security fields. What it offers: text/plain and application/json modes and the run-tests skill. A dot marks each REQUIRED field.</desc><rect width="600" height="40" x="20" y="10" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="25.25" font-size="12.5" font-weight="700">test-runner agent card</text><text x="32" y="42.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">GET http://localhost:41241/.well-known/agent-card.json</text><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><rect width="600" height="24" x="20" y="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="74" fill="var(--m-blue-ink, #2f5d9a)" font-size="11" letter-spacing="1.2">WHO IT IS</text><text x="204" y="74" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">identity, plus proof of who published it</text><rect width="600" height="22" x="20" y="82" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="93" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="97" font-size="12" font-weight="700">name</text><text x="204" y="97" font-size="11">&quot;test-runner&quot;</text><rect width="600" height="36" x="20" y="104" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="115" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="119" font-size="12" font-weight="700">description</text><text x="204" y="119" font-size="11">&quot;Checks out a commit, runs its test suite in a</text><text x="204" y="134" font-size="11">clean container, and streams the log.&quot;</text><rect width="600" height="22" x="20" y="140" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><text x="40" y="155" font-size="12">provider</text><text x="204" y="155" font-size="11">organization &quot;Platform Team&quot;, url &quot;https://ci.example.com&quot;</text><rect width="600" height="22" x="20" y="162" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="173" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="177" font-size="12" font-weight="700">version</text><text x="204" y="177" font-size="11">&quot;2.3.0&quot;</text><text x="610" y="177" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="end">the agent release, not the protocol version</text><rect width="600" height="22" x="20" y="184" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/><text x="40" y="199" fill="var(--m-ink-mute, #6f6f6a)" font-size="12">documentationUrl</text><text x="204" y="199" fill="var(--m-ink-mute, #6f6f6a)" font-size="11">not set</text><rect width="600" height="22" x="20" y="206" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/><text x="40" y="221" fill="var(--m-ink-mute, #6f6f6a)" font-size="12">iconUrl</text><text x="204" y="221" fill="var(--m-ink-mute, #6f6f6a)" font-size="11">not set</text><rect width="600" height="22" x="20" y="228" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/><text x="40" y="243" fill="var(--m-ink-mute, #6f6f6a)" font-size="12">signatures</text><text x="204" y="243" fill="var(--m-ink-mute, #6f6f6a)" font-size="11">not set</text><text x="610" y="243" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="end">deployer signs its card (section 2.3)</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><rect width="600" height="24" x="20" y="256" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="272" fill="var(--m-blue-ink, #2f5d9a)" font-size="11" letter-spacing="1.2">WHERE TO REACH IT</text><text x="204" y="272" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">ordered, and the first entry is preferred</text><rect width="600" height="36" x="20" y="280" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="291" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="295" font-size="12" font-weight="700">supportedInterfaces</text><text x="204" y="295" font-size="11">[0] JSONRPC, &quot;1.0&quot;, http://localhost:41241/a2a/jsonrpc</text><text x="204" y="310" font-size="11">[1] HTTP+JSON, &quot;1.0&quot;, http://localhost:41241/a2a/rest</text></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" type="translate" values="0 4;0 4;0 0"/><rect width="600" height="24" x="20" y="322" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="338" fill="var(--m-blue-ink, #2f5d9a)" font-size="11" letter-spacing="1.2">WHAT IT DEMANDS</text><text x="204" y="338" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">an absent flag counts the same as false</text><rect width="600" height="22" x="20" y="346" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="357" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="361" font-size="12" font-weight="700">capabilities</text><text x="204" y="361" font-size="11">streaming true, pushNotifications true</text><rect width="600" height="22" x="20" y="368" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/><text x="40" y="383" fill="var(--m-ink-mute, #6f6f6a)" font-size="12">securitySchemes</text><text x="204" y="383" fill="var(--m-ink-mute, #6f6f6a)" font-size="11">not set</text><rect width="600" height="22" x="20" y="390" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/><text x="40" y="405" fill="var(--m-ink-mute, #6f6f6a)" font-size="12">securityRequirements</text><text x="204" y="405" fill="var(--m-ink-mute, #6f6f6a)" font-size="11">not set</text><text x="610" y="405" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="end">so calls need no credentials</text></g><g data-beat="4"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" type="translate" values="0 4;0 4;0 0"/><rect width="600" height="24" x="20" y="418" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="32" y="434" fill="var(--m-blue-ink, #2f5d9a)" font-size="11" letter-spacing="1.2">WHAT IT OFFERS</text><text x="204" y="434" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">media types, and skills that describe work</text><rect width="600" height="22" x="20" y="442" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="453" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="457" font-size="12" font-weight="700">defaultInputModes</text><text x="204" y="457" font-size="11">&quot;text/plain&quot;, &quot;application/json&quot;</text><rect width="600" height="22" x="20" y="464" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="475" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="479" font-size="12" font-weight="700">defaultOutputModes</text><text x="204" y="479" font-size="11">&quot;text/plain&quot;, &quot;application/json&quot;</text><rect width="600" height="36" x="20" y="486" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/><circle cx="30" cy="497" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="501" font-size="12" font-weight="700">skills</text><text x="204" y="501" font-size="11">[0] id &quot;run-tests&quot;, name &quot;Run tests&quot;,</text><text x="204" y="516" font-size="11">tags &quot;ci&quot;, &quot;tests&quot;</text><text x="610" y="516" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="end">plus a description and one example</text></g><circle cx="30" cy="540" r="3" fill="var(--m-blue-ink, #2f5d9a)"/><text x="40" y="544" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">REQUIRED in proto AgentCard</text><rect width="26" height="14" x="250" y="533" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/><text x="284" y="544" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">optional, and not set on this card</text></svg>