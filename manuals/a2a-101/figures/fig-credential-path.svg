<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-credential-path-title fig-credential-path-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 456"><title id="fig-credential-path-title">From the card to an enforced request and an in-task approval</title><desc id="fig-credential-path-desc">Five steps for the deployer agent. Step one: the card declares a bearer scheme and requires it, and the platform team issues a token outside A2A. Step two: GetExtendedAgentCard without a token gets HTTP 401 with a WWW-Authenticate challenge. Step three: the same call with the token gets the extended card with a rollback skill. Step four: a streamed deploy with the token stops the task in TASK_STATE_AUTH_REQUIRED. Step five: an operator approves at the deployer outside A2A and the task works and completes on the same stream.</desc><defs><marker id="fig-credential-path-head-rose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-rose-ink, #b0344d)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-credential-path-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-credential-path-head-olive" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-olive-ink, #515f26)" d="M0 1 L10 5 L0 9 z"/></marker></defs><text x="20" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">1 · THE CARD DECLARES, THE CLIENT OBTAINS</text><text x="20" y="122" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">2 · HTTP CHECKS BEFORE ANY A2A METHOD RUNS</text><text x="20" y="282" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">3 · THE TASK ASKS FOR MORE, OUTSIDE A2A</text><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><rect width="236" height="68" x="20" y="26" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="138" y="40.25" font-size="12.5" font-weight="700" text-anchor="middle">deployer card</text><text x="138" y="57.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">securitySchemes: bearer</text><text x="138" y="72.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">httpAuthSecurityScheme, Bearer</text><text x="138" y="87.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">securityRequirements: bearer</text><rect width="280" height="68" x="340" y="26" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/><text x="480" y="47.75" font-size="12.5" font-weight="700" text-anchor="middle">platform team</text><text x="480" y="65.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">issues the token dpl_test_7c1e4b</text><text x="480" y="80.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">outside A2A, before any request</text></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><rect width="236" height="46" x="20" y="130" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="138" y="148.25" font-size="12.5" font-weight="700" text-anchor="middle">GetExtendedAgentCard</text><text x="138" y="165.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">no Authorization header</text><rect width="280" height="46" x="340" y="130" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="480" y="148.25" font-size="12.5" font-weight="700" text-anchor="middle">HTTP 401 Unauthorized</text><text x="480" y="165.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">WWW-Authenticate: Bearer realm=&quot;deployer&quot;</text><line x1="256" x2="339" y1="153" y2="153" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-credential-path-head-rose)"/><circle r="3.5" fill="var(--m-rose-ink, #b0344d)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="1.4s" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" path="M256 153 L339 153"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="1.4s" keyTimes="0;0.429;0.486;0.821;1" values="0;0;1;1;0"/></circle><rect width="54.3" height="15.5" x="270.85" y="136.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="298" y="147" fill="var(--m-rose-ink, #b0344d)" font-size="11.5" text-anchor="middle">refused</text></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" type="translate" values="0 4;0 4;0 0"/><rect width="236" height="58" x="20" y="196" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="138" y="212.75" font-size="12.5" font-weight="700" text-anchor="middle">GetExtendedAgentCard</text><text x="138" y="230.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">Authorization: Bearer</text><text x="138" y="245.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">dpl_test_7c1e4b</text><rect width="280" height="58" x="340" y="196" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="480" y="212.75" font-size="12.5" font-weight="700" text-anchor="middle">200 OK, extended card</text><text x="480" y="230.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">one more skill: rollback</text><text x="480" y="245.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">shown only to authenticated callers</text><line x1="256" x2="339" y1="225" y2="225" stroke="var(--m-ink, #1a1a1a)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-credential-path-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="2s" keyPoints="0;0;1;1" keyTimes="0;0.6;0.875;1" path="M256 225 L339 225"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="2s" keyTimes="0;0.6;0.64;0.875;1" values="0;0;1;1;0"/></circle><rect width="61.2" height="15.5" x="267.4" y="208.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="298" y="219" font-size="11.5" text-anchor="middle">accepted</text></g><g data-beat="4"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" type="translate" values="0 4;0 4;0 0"/><rect width="236" height="58" x="20" y="290" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="138" y="306.75" font-size="12.5" font-weight="700" text-anchor="middle">SendStreamingMessage</text><text x="138" y="324.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">Deploy build 2026.10.06-1</text><text x="138" y="339.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">to staging, with the token</text><rect width="280" height="58" x="340" y="290" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/><text x="480" y="306.75" font-size="12.5" font-weight="700" text-anchor="middle">TASK_STATE_AUTH_REQUIRED</text><text x="480" y="324.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">task ecf2dcb6 waits, stream open</text><text x="480" y="339.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">an operator must approve</text><line x1="256" x2="339" y1="319" y2="319" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-credential-path-head-ink)"/><circle r="3.5" fill="var(--m-ink, #1a1a1a)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="2.6s" keyPoints="0;0;1;1" keyTimes="0;0.692;0.904;1" path="M256 319 L339 319"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="2.6s" keyTimes="0;0.692;0.723;0.904;1" values="0;0;1;1;0"/></circle><rect width="47.4" height="15.5" x="274.3" y="302.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="298" y="313" font-size="11.5" text-anchor="middle">deploy</text></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><rect width="236" height="58" x="20" y="384" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/><text x="138" y="400.75" font-size="12.5" font-weight="700" text-anchor="middle">operator approves</text><text x="138" y="418.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">POST /approve/ecf2dcb6</text><text x="138" y="433.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">at the deployer, not in A2A</text><rect width="280" height="58" x="340" y="384" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/><rect width="274" height="52" x="343" y="387" fill="none" stroke="var(--m-amber-ink, #85590c)"/><text x="480" y="400.75" font-size="12.5" font-weight="700" text-anchor="middle">TASK_STATE_COMPLETED</text><text x="480" y="418.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">after TASK_STATE_WORKING</text><text x="480" y="433.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">on the same stream</text><path fill="none" stroke="var(--m-olive-ink, #515f26)" stroke-dasharray="5 4" stroke-linejoin="round" stroke-width="1.2" marker-end="url(#fig-credential-path-head-olive)" d="M380 348 V366 H138 V383"/><circle r="3.5" fill="var(--m-olive-ink, #515f26)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.2s" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" path="M380 348 V366 H138 V383"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.2s" keyTimes="0;0.75;0.775;0.922;1" values="0;0;1;1;0"/></circle><text x="298" y="360" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">the approval link</text><line x1="256" x2="339" y1="413" y2="413" stroke="var(--m-olive-ink, #515f26)" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#fig-credential-path-head-olive)"/><circle r="3.5" fill="var(--m-olive-ink, #515f26)" class="m-packet" opacity="0"><animateMotion fill="freeze" begin="indefinite" calcMode="linear" dur="3.2s" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" path="M256 413 L339 413"/><animate fill="freeze" attributeName="opacity" begin="indefinite" dur="3.2s" keyTimes="0;0.75;0.775;0.922;1" values="0;0;1;1;0"/></circle><rect width="54.3" height="15.5" x="270.85" y="396.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="298" y="407" fill="var(--m-olive-ink, #515f26)" font-size="11.5" text-anchor="middle">resumes</text></g></svg>