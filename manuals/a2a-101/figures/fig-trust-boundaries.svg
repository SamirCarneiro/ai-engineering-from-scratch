<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-trust-boundaries-title fig-trust-boundaries-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 444"><title id="fig-trust-boundaries-title">Trust boundaries in the kit</title><desc id="fig-trust-boundaries-desc">Six rows, one per place where data crosses between parties in the kit, shown in the order the planner meets them. Agent card: a spoofed card sends messages elsewhere, so the planner verifies signatures over HTTPS. Parts in replies such as review.json: text written as orders, so the planner validates data parts and decides on typed fields. File and URL parts: bad files, or an agent that fetches any URL it is given, so the agent checks type, size, and URLs. Webhook URL: SSRF, so the agent rejects private hosts. Incoming notifications: forgery, so the planner checks Authorization and the task id. Stored records: secrets kept in clear, so agents redact, scope reads, and set retention.</desc><text x="20" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">WHERE DATA CROSSES</text><text x="232" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">THREAT</text><text x="432" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">CHECK</text><rect width="14" height="12" x="232" y="422" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="252" y="432" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">the planner checks</text><rect width="14" height="12" x="432" y="422" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="452" y="432" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">the remote agent checks</text><g data-beat="1"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="0.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0;1" type="translate" values="0 4;0 4;0 0"/><rect width="200" height="50" x="20" y="28" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="120" y="48.1" font-size="12" font-weight="700" text-anchor="middle">agent card</text><text x="120" y="65.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">/.well-known/agent-card.json</text><rect width="188" height="50" x="232" y="28" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="326" y="48.1" font-size="12" font-weight="700" text-anchor="middle">spoofed card</text><text x="326" y="65.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">messages go to its endpoint</text><rect width="188" height="50" x="432" y="28" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="526" y="48.1" font-size="12" font-weight="700" text-anchor="middle">verify signatures</text><text x="526" y="65.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">kid deployer-key-1, HTTPS</text><line x1="220" x2="232" y1="53" y2="53" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="420" x2="432" y1="53" y2="53" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/></g><g data-beat="2"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.05s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.571;1" type="translate" values="0 4;0 4;0 0"/><rect width="200" height="50" x="20" y="94" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="120" y="114.1" font-size="12" font-weight="700" text-anchor="middle">parts in replies</text><text x="120" y="131.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">review.json, test-log.txt</text><rect width="188" height="50" x="232" y="94" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="326" y="114.1" font-size="12" font-weight="700" text-anchor="middle">injected orders</text><text x="326" y="131.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">text that reads as orders</text><rect width="188" height="50" x="432" y="94" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="526" y="114.1" font-size="12" font-weight="700" text-anchor="middle">validate data parts</text><text x="526" y="131.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">decide on typed fields</text><line x1="220" x2="232" y1="119" y2="119" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="420" x2="432" y1="119" y2="119" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/></g><g data-beat="3"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="1.65s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.727;1" type="translate" values="0 4;0 4;0 0"/><rect width="200" height="50" x="20" y="160" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/><text x="120" y="180.1" font-size="12" font-weight="700" text-anchor="middle">file and URL parts</text><text x="120" y="197.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">refunds.diff, screenshot.png</text><rect width="188" height="50" x="232" y="160" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="326" y="180.1" font-size="12" font-weight="700" text-anchor="middle">bad files, SSRF</text><text x="326" y="197.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">the agent fetches any URL</text><rect width="188" height="50" x="432" y="160" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="526" y="180.1" font-size="12" font-weight="700" text-anchor="middle">check type and size</text><text x="526" y="197.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">validate URLs first</text><line x1="220" x2="232" y1="185" y2="185" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="420" x2="432" y1="185" y2="185" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/></g><g data-beat="4"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.25s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.8;1" type="translate" values="0 4;0 4;0 0"/><rect width="200" height="50" x="20" y="226" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/><text x="120" y="246.1" font-size="12" font-weight="700" text-anchor="middle">webhook URL</text><text x="120" y="263.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">localhost:41250/a2a-events</text><rect width="188" height="50" x="232" y="226" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="326" y="246.1" font-size="12" font-weight="700" text-anchor="middle">SSRF</text><text x="326" y="263.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">posts to internal hosts</text><rect width="188" height="50" x="432" y="226" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="526" y="246.1" font-size="12" font-weight="700" text-anchor="middle">reject private hosts</text><text x="526" y="263.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">or keep an allowlist</text><line x1="220" x2="232" y1="251" y2="251" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="420" x2="432" y1="251" y2="251" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/></g><g data-beat="5"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="2.85s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.842;1" type="translate" values="0 4;0 4;0 0"/><rect width="200" height="50" x="20" y="292" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/><text x="120" y="312.1" font-size="12" font-weight="700" text-anchor="middle">POST /a2a-events</text><text x="120" y="329.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">a notification arrives</text><rect width="188" height="50" x="232" y="292" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="326" y="312.1" font-size="12" font-weight="700" text-anchor="middle">forged notification</text><text x="326" y="329.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">acts on a fake event</text><rect width="188" height="50" x="432" y="292" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/><text x="526" y="312.1" font-size="12" font-weight="700" text-anchor="middle">check Authorization</text><text x="526" y="329.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">and that taskId is yours</text><line x1="220" x2="232" y1="317" y2="317" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="420" x2="432" y1="317" y2="317" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/></g><g data-beat="6"><animate fill="freeze" attributeName="opacity" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" values="0;0;1"/><animateTransform fill="freeze" attributeName="transform" begin="indefinite" calcMode="spline" dur="3.45s" keySplines="0 0 1 1;0.23 1 0.32 1" keyTimes="0;0.87;1" type="translate" values="0 4;0 4;0 0"/><rect width="200" height="50" x="20" y="358" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/><text x="120" y="378.1" font-size="12" font-weight="700" text-anchor="middle">stored records</text><text x="120" y="395.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">history, configs, logs</text><rect width="188" height="50" x="232" y="358" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/><text x="326" y="378.1" font-size="12" font-weight="700" text-anchor="middle">secrets kept in clear</text><text x="326" y="395.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">hook_secret_91d2 echoed</text><rect width="188" height="50" x="432" y="358" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="526" y="378.1" font-size="12" font-weight="700" text-anchor="middle">redact, scope reads</text><text x="526" y="395.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">set a retention policy</text><line x1="220" x2="232" y1="383" y2="383" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/><line x1="420" x2="432" y1="383" y2="383" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/></g></svg>