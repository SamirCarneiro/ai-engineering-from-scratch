<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-5-5-title fig-5-5-desc" font-family="JetBrains Mono, ui-monospace, monospace" role="img" viewBox="0 0 640 296"><title id="fig-5-5-title">One bundle from the MCP session to four readers</title><desc id="fig-5-5-desc">Left: the MCP session on ledger-arm64-O1 holds eight records and no unknowns, and export_evidence_bundle writes them. Middle: bundle-O1.json, 178,853 bytes as written, 178,398 bytes in the masked kit copy, seven arrays of canonical JSON. Right: four readers. rea inspect-evidence-bundle prints eight rows and zero unknown revisions. rea evidence-export writes canonical-O1.json with 178,397 bytes and the same JSON. rea evidence-import validates it and reports imported 8 and total 8. import_evidence_bundle in the O2 MCP session reports imported 6 and total 15, because two of the eight records were already in that ledger.</desc><defs><marker id="fig-5-5-head-teal" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-teal-ink, #18696a)" d="M0 1 L10 5 L0 9 z"/></marker><marker id="fig-5-5-head-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--m-ink, #1a1a1a)" d="M0 1 L10 5 L0 9 z"/></marker></defs><text x="20" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">THE LEDGER</text><text x="260" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">THE FILE</text><text x="440" y="18" fill="var(--m-ink-mute, #6f6f6a)" font-size="11" letter-spacing="1.2">THE READERS</text><rect width="180" height="72" x="20" y="62" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/><text x="110" y="85.75" font-size="12.5" font-weight="700" text-anchor="middle">MCP session, O1</text><text x="110" y="103.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">8 records, 0 unknowns</text><text x="110" y="118.05" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">ledger of one connection</text><rect width="160" height="72" x="260" y="62" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/><text x="340" y="78.25" font-size="12.5" font-weight="700" text-anchor="middle">bundle-O1.json</text><text x="340" y="95.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">178,853 bytes written</text><text x="340" y="110.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">kit copy 178,398 bytes</text><text x="340" y="125.55" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">7 arrays, canonical</text><line x1="200" x2="259" y1="98" y2="98" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-5-5-head-teal)"/><rect width="47.4" height="15.5" x="205.8" y="81.03" fill="var(--m-panel, #f3f1e8)" class="m-knock"/><text x="229.5" y="92" fill="var(--m-teal-ink, #18696a)" font-size="11.5" text-anchor="middle">export</text><rect width="180" height="44" x="440" y="28" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="530" y="44.8" font-size="11" font-weight="700" text-anchor="middle">inspect-evidence-bundle</text><text x="530" y="61.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">8 rows, 0 unknowns</text><rect width="180" height="52" x="440" y="88" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="530" y="101.3" font-size="11" font-weight="700" text-anchor="middle">evidence-export</text><text x="530" y="118.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">178,397 bytes, same JSON</text><text x="530" y="133.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">sha256 47160c2d</text><rect width="180" height="44" x="440" y="148" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/><text x="530" y="164.8" font-size="11" font-weight="700" text-anchor="middle">evidence-import</text><text x="530" y="181.8" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">imported 8, total 8</text><rect width="180" height="52" x="440" y="208" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/><text x="530" y="221.3" font-size="11" font-weight="700" text-anchor="middle">import_evidence_bundle</text><text x="530" y="238.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">into the O2 session</text><text x="530" y="253.3" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11" text-anchor="middle">imported 6, total 15</text><path fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-linejoin="round" stroke-width="1.2" marker-end="url(#fig-5-5-head-ink)" d="M420 98 H430 V50 H439"/><path fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-linejoin="round" stroke-width="1.2" marker-end="url(#fig-5-5-head-ink)" d="M420 98 H430 V114 H439"/><path fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-linejoin="round" stroke-width="1.2" marker-end="url(#fig-5-5-head-ink)" d="M420 98 H430 V170 H439"/><path fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-linejoin="round" stroke-width="1.2" marker-end="url(#fig-5-5-head-ink)" d="M420 98 H430 V234 H439"/><text x="20" y="170" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">The server wrote 178,853 bytes. The kit masked the path and</text><text x="20" y="185" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">added a newline, so its copy has 178,398 bytes. Without</text><text x="20" y="200" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">the newline it has the digest of canonical-O1.json.</text><text x="440" y="284" fill="var(--m-ink-soft, #4a4a4a)" class="m-serif" font-size="11">2 of 8 already in the ledger</text></svg>