<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small{font-size:10px;font-family:&apos;Menlo&apos;,monospace;fill:#555}.edge{stroke:#1a1a1a;stroke-width:1.2;fill:none}</style></defs><text x="450" y="28" class="title" text-anchor="middle">A2A protocol — agent-to-agent discovery, task, artifact</text><rect width="180" height="380" x="40" y="60" class="cool"/><text x="130" y="82" class="head" text-anchor="middle">Client Agent</text><text x="130" y="104" class="small" text-anchor="middle">LangGraph? CrewAI? custom?</text><text x="130" y="124" class="small" text-anchor="middle">doesn&apos;t matter to A2A</text><text x="130" y="144" class="small" text-anchor="middle">sends A2A-Version: 1.0</text><rect width="180" height="380" x="680" y="60" class="hot"/><text x="770" y="82" class="head" text-anchor="middle">Remote Agent</text><text x="770" y="104" class="small" text-anchor="middle">code-review-agent</text><text x="770" y="124" class="small" text-anchor="middle">opaque implementation</text><line x1="220" x2="680" y1="160" y2="160" marker-end="url(#arrow)" class="edge"/><text x="450" y="152" class="small" text-anchor="middle">GET /.well-known/agent-card.json</text><line x1="680" x2="220" y1="200" y2="200" marker-end="url(#arrow)" class="edge"/><text x="450" y="192" class="small" text-anchor="middle">Agent Card: skills, supportedInterfaces, securityRequirements</text><line x1="220" x2="680" y1="240" y2="240" marker-end="url(#arrow)" class="edge"/><text x="450" y="232" class="small" text-anchor="middle">POST /message:send {message: {role: ROLE_USER, parts: [...]}}</text><line x1="680" x2="220" y1="280" y2="280" marker-end="url(#arrow)" class="edge"/><text x="450" y="272" class="small" text-anchor="middle">200 {task: {id: baf1fc13, status: {state: TASK_STATE_SUBMITTED}}}</text><line x1="220" x2="680" y1="320" y2="320" marker-end="url(#arrow)" class="edge"/><text x="450" y="312" class="small" text-anchor="middle">GET /tasks/baf1fc13 (poll)</text><line x1="680" x2="220" y1="360" y2="360" marker-end="url(#arrow)" class="edge"/><text x="450" y="352" class="small" text-anchor="middle">TASK_STATE_COMPLETED, artifacts=[{parts: [{data: {...}}]}]</text><rect width="440" height="40" x="230" y="395" class="cold"/><text x="450" y="411" class="small" text-anchor="middle">TASK_STATE_SUBMITTED → TASK_STATE_WORKING → TASK_STATE_COMPLETED</text><text x="450" y="426" class="small" text-anchor="middle">(or TASK_STATE_FAILED / TASK_STATE_CANCELED)</text><rect width="820" height="50" x="40" y="460" class="box"/><text x="450" y="482" class="head" text-anchor="middle">A2A (horizontal, agent↔agent) vs MCP (vertical, agent↔tool) — production uses both</text><text x="450" y="500" class="small" text-anchor="middle">150+ orgs by April 2026 · Google Vertex AI Agent Builder · Microsoft Agent Framework · LangGraph / CrewAI / AutoGen adapters</text></svg>